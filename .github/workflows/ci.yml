name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: SQLite headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev ninja-build
      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/beliefdb_tests
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          case "${{ matrix.os }}" in ubuntu*) P=linux-x64;; macos*) P=macos-arm64;; esac
          mkdir -p dist/beliefdb-$V-$P
          cp build/belief build/belief-mcp build/beliefd README.md LICENSE AGENTS.md dist/beliefdb-$V-$P/
          tar -C dist -czf beliefdb-$V-$P.tar.gz beliefdb-$V-$P
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: beliefdb-*.tar.gz
